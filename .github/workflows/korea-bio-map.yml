name: Korea Bio Map Collector

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch containing Korea Bio Map code"
        required: true
        default: "about-bio-v0.1"
      mode:
        description: "What should this run do?"
        required: true
        default: "all"
        type: choice
        options:
          - galaxy-full
          - alumni
          - rebuild
          - all
          - promote-and-all
          - discover-departments
          - collect-faculty-agent
          - scrape-faculty-v2
          - match-faculty-identities-v2
          - faculty-full-v2
          - import-faculty-v2
          - import-faculty-v2-and-all
          - scrape-faculty
          - match-faculty-identities
          - faculty-full
          - import-faculty
          - import-faculty-and-all

permissions:
  contents: write

# The daily run and a manual run must not collect at the same time.
concurrency:
  group: korea-bio-map
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # GitHub-hosted max is 360; 2,500+ people take ~3 h
    env:
      PYTHONUNBUFFERED: "1"
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACULTY_AGENT_MODEL: "gpt-5.6-luna"
      FACULTY_AGENT_SOURCE_LIMIT: "2"
      ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
      ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
      OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
      SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
      SCOPUS_REQUEST_LIMIT: "3000"
      IDENTITY_BATCH_LIMIT: "400"
      PROFILE_FETCH_LIMIT: "600"
      DISCOVERY_UNIVERSITY_LIMIT: "20"
      INSTITUTION_DISCOVERY_LIMIT: "20"
      CRAWL_PAGE_LIMIT: "100"
      SCHOLAR_LOOKUP_LIMIT: "60"

    steps:
      - name: Checkout Korea Bio Map branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: "0. korea bio map"
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: "0. korea bio map"
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Run Korea Bio Map pipeline
        working-directory: "0. korea bio map"
        run: python src/main.py "${{ inputs.mode }}"

      - name: Upload generated files
        # Keep partial progress (e.g. identity batches) even if a later step failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: korea-bio-map-output
          path: |
            0. korea bio map/output/*.csv
            0. korea bio map/web/network-data.js
          if-no-files-found: error

      - name: Upload alumni rows for checking
        # Per-person alumni rows stay out of the repository (private people);
        # kept briefly so the parser can be checked.
        if: ${{ !cancelled() && inputs.mode == 'alumni' }}
        uses: actions/upload-artifact@v4
        with:
          name: lab-alumni-people
          path: 0. korea bio map/output/alumni/*.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit generated data back to target branch
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "0. korea bio map/output/"*.csv
          git add "0. korea bio map/web/network-data.js"
          git add "0. korea bio map/data/professors_seed.csv"
          git add "0. korea bio map/data/faculty_sources.csv"
          if [ -f "0. korea bio map/data/discovery_log.csv" ]; then
            git add "0. korea bio map/data/discovery_log.csv"
          fi
          for f in lab_sites.csv lab_sites_manual.csv; do
            if [ -f "0. korea bio map/data/$f" ]; then
              git add "0. korea bio map/data/$f"
            fi
          done
          if [ -f "0. korea bio map/data/institution_discovery_log.csv" ]; then
            git add "0. korea bio map/data/institution_discovery_log.csv"
          fi
          if [ -f "0. korea bio map/data/scopus_author_cache.csv" ]; then
            git add "0. korea bio map/data/scopus_author_cache.csv"
          fi
          if [ -f "0. korea bio map/data/candidate_web_cache.csv" ]; then
            git add "0. korea bio map/data/candidate_web_cache.csv"
          fi
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update Korea Bio Map generated data"
            # Code may have been pushed while this run was going: replay the
            # data commit on top (this run's data wins on conflicts) and retry.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin "${{ inputs.target_branch }}" && \
                git push origin HEAD:"${{ inputs.target_branch }}" && break
              sleep $((attempt * 5))
            done
          fi

      - name: Publish latest map to gh-pages
        if: ${{ inputs.mode == 'galaxy-full' || inputs.mode == 'alumni' || inputs.mode == 'rebuild' || inputs.mode == 'all' || inputs.mode == 'promote-and-all' || inputs.mode == 'import-faculty-and-all' || inputs.mode == 'import-faculty-v2-and-all' }}
        run: |
          rm -rf /tmp/korea-bio-map-pages
          mkdir -p /tmp/korea-bio-map-pages
          # Every page of the site (map, community ...) plus the map data.
          cp "0. korea bio map/web/"*.html /tmp/korea-bio-map-pages/
          cp "0. korea bio map/web/network-data.js" /tmp/korea-bio-map-pages/network-data.js

          git fetch origin gh-pages
          git switch gh-pages
          cp /tmp/korea-bio-map-pages/* ./
          git add ./*.html network-data.js

          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git commit -m "Publish latest Korea Bio Map"
            git push origin gh-pages
          fi
