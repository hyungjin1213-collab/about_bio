<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>About Bio - Korea Bio Map</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at center,#0b1230 0%,#030611 55%,#000 100%);font-family:Arial,sans-serif;color:#fff}
    #graph{position:fixed;inset:0}
    .panel{position:fixed;top:14px;left:14px;z-index:20;background:rgba(3,7,18,.72);backdrop-filter:blur(10px);padding:12px 14px;border:1px solid rgba(255,255,255,.10);border-radius:14px;max-width:290px;pointer-events:none}
    .panel h1{font-size:18px;margin:0 0 4px}.panel p{font-size:12px;color:#9aa7c7;margin:0 0 7px}
    .legend{font-size:12px;line-height:1.55;color:#d7def0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
    .lines{font-size:11.5px;line-height:1.7;color:#d7def0;margin:0 0 8px}
    .line{display:inline-block;width:22px;margin-right:6px;vertical-align:middle;border-radius:2px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;box-shadow:0 0 8px currentColor}
    .hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;font-size:11px;color:#7f8aa8;background:rgba(3,7,18,.55);padding:6px 9px;border-radius:999px;pointer-events:none;white-space:nowrap}
    .side{position:fixed;top:14px;right:14px;z-index:21;width:300px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:rgba(3,7,18,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.10);border-radius:14px;overflow:hidden}
    .side[hidden]{display:none}
    .tabs{display:flex;gap:4px;padding:8px 8px 0}
    .tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:#9aa7c7;font:600 13px Arial,sans-serif;padding:7px 4px;cursor:pointer}
    .tabs button.on{color:#fff;border-bottom-color:#fbbf24}
    .tabs .fold{flex:0 0 30px;font-size:16px}
    .pane{display:flex;flex-direction:column;min-height:0;padding:8px}
    .pane[hidden]{display:none}
    .side input,.side select{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:9px;color:#fff;font-size:13px;padding:8px 10px;outline:none}
    .side input:focus,.side select:focus{border-color:#fbbf24}
    .side select option{background:#0b1230}
    .filters{display:flex;gap:6px}
    .list{list-style:none;margin:8px 0 0;padding:0;overflow-y:auto;max-height:calc(100vh - 190px)}
    .row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;cursor:pointer}
    .row:hover,.row.active{background:rgba(255,255,255,.08)}
    .rank{flex:0 0 24px;text-align:right;font-weight:700;color:#fbbf24;font-size:13px}
    .who{flex:1;min-width:0}
    .who b{font-size:13px}.who small{display:block;color:#9aa7c7;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .val{flex:0 0 auto;font-size:12px;color:#d7def0}
    .badge{display:inline-block;min-width:16px;margin-left:4px;padding:0 4px;border-radius:999px;background:#fbbf24;color:#111;font-size:11px}
    .badge[hidden]{display:none}
    .filter-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9aa7c7}
    .reset{background:none;border:1px solid rgba(255,255,255,.2);color:#d7def0;border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
    .fgroup h4{margin:12px 0 6px;font-size:12px;color:#9aa7c7;font-weight:600}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.14);font-size:12px;color:#d7def0;cursor:pointer;user-select:none}
    .chip input{display:none}
    .chip.on{background:rgba(251,191,36,.16);border-color:#fbbf24;color:#fff}
    .chip.empty-chip{opacity:.4}
    .chip small{color:#9aa7c7}
    .who small.match{color:#fbbf24}
    .who small.match.tech{color:#5eead4}
    .seg{display:flex;gap:4px;margin-top:6px}
    .seg button{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#9aa7c7;border-radius:8px;padding:5px 0;font-size:12px;cursor:pointer}
    .seg button.on{color:#fff;border-color:#fbbf24;background:rgba(251,191,36,.12)}
    .kw{color:#c7d2fe}
    .empty{color:#7f8aa8;font-size:12px;padding:10px 6px}
    .open-side{position:fixed;top:14px;right:14px;z-index:21;background:rgba(3,7,18,.78);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 13px;font:600 13px Arial,sans-serif;cursor:pointer}
    .open-side[hidden]{display:none}
    /* professor card */
    .card{position:fixed;top:14px;left:14px;z-index:22;width:340px;max-height:calc(100vh - 90px);overflow-y:auto;background:rgba(5,9,22,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
    .card[hidden]{display:none}
    body.card-open .panel{display:none}
    .card .close{position:absolute;top:10px;right:10px;background:none;border:0;color:#9aa7c7;font-size:18px;cursor:pointer}
    .card h2{margin:0 26px 2px 0;font-size:20px}
    .card .en{color:#9aa7c7;font-size:13px;margin-left:4px;font-weight:400}
    .card .org{color:#d7def0;font-size:13px;margin:4px 0 8px}
    .card h3{font-size:12px;color:#9aa7c7;font-weight:600;margin:14px 0 6px;letter-spacing:.02em}
    .tags{display:flex;flex-wrap:wrap;gap:5px}
    .tag{font-size:11.5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:#dbe4ff;border:1px solid rgba(255,255,255,.08)}
    .tag.tech{color:#99f6e4}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .stat{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 4px;text-align:center}
    .stat b{display:block;font-size:17px;color:#fff}.stat span{font-size:10.5px;color:#9aa7c7}
    .people{display:flex;flex-wrap:wrap;gap:5px}
    .people button{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35);color:#fde68a;border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
    .people button.pd{background:rgba(192,132,252,.10);border-color:rgba(192,132,252,.35);color:#e9d5ff}
    .lab{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;color:#d7def0}
    .lab span:nth-child(even){color:#fff;font-weight:600;text-align:right}
    .muted{color:#7f8aa8;font-size:12px;line-height:1.5}
    .seg.period{margin:0 0 8px}
    .fgroup .seg.period{margin:2px 0 6px}
    .careers{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px}
    .careers i{display:block;min-width:4px}
    .career-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:#d7def0}
    .career-legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
    .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .links a{font-size:12px;color:#93c5fd;text-decoration:none;border:1px solid rgba(147,197,253,.3);border-radius:8px;padding:5px 9px}
    .recruit{display:inline-block;margin-left:6px;font-size:11px;padding:2px 7px;border-radius:999px;background:#fbbf24;color:#111;vertical-align:middle}
    /* community button */
    .community{position:fixed;right:14px;bottom:14px;z-index:21;display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#111;font:700 13px Arial,sans-serif;padding:10px 15px;border-radius:999px;text-decoration:none;box-shadow:0 6px 24px rgba(251,191,36,.35)}
    .community:hover{filter:brightness(1.08)}
    .viewbar{position:fixed;left:14px;bottom:14px;z-index:21;display:flex;gap:3px;background:rgba(3,7,18,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px}
    .viewbar label{display:inline-flex;align-items:center;gap:7px;color:#d7def0;font:600 12px Arial,sans-serif;padding:5px 11px;cursor:pointer;user-select:none}
    .viewbar input{accent-color:#fbbf24;width:15px;height:15px;margin:0}
    .viewbar label+label{border-left:1px solid rgba(255,255,255,.12)}
    .viewbar:has(input:checked){border-color:#fbbf24;background:rgba(40,32,8,.82)}
    .setbar{position:fixed;left:14px;bottom:62px;z-index:21;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100vw - 360px);background:rgba(3,7,18,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:7px 9px}
    .setbar[hidden]{display:none}
    .setbar button{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#d7def0;border-radius:999px;padding:5px 10px;font:600 12px Arial,sans-serif;cursor:pointer}
    .setbar button.on{border-color:#fbbf24;background:rgba(251,191,36,.14);color:#fff}
    .setbar button small{color:#9aa7c7;font-weight:400}
    .setbar label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#d7def0;cursor:pointer;padding:0 4px;border-left:1px solid rgba(255,255,255,.14);margin-left:2px}
    .setbar input{accent-color:#fbbf24;margin:0 0 0 6px}
    @media (max-width:640px){
      .panel{max-width:calc(100vw - 150px);padding:9px 11px}
      .panel .lines,.panel .legend,.panel p{display:none}
      .panel h1{font-size:15px;margin:0}
      .side{top:auto;bottom:52px;left:10px;right:10px;width:auto;max-height:52vh}
      .list{max-height:calc(52vh - 110px)}
      .hint{display:none}
      .viewbar{left:10px;bottom:10px;flex-direction:column;align-items:flex-start;border-radius:14px}
      .card{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:62vh}
      .community{right:10px;bottom:10px;padding:9px 12px}
      .setbar{left:10px;right:10px;max-width:none;bottom:54px}
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Korea Bio Map · 3D</h1>
    <p>교수 = 별 · score = 별 크기 · 색 = 분야</p>
    <div class="lines">
      <div><span class="line" style="background:#fbbf24;height:3px"></span>지도교수 → 제자 (PI 10점 · 제자 1점)</div>
      <div><span class="line" style="background:#c084fc;height:2px"></span>포닥 멘토 → 포닥 (PI 3점 · 포닥 1점)</div>
      <div><span class="line" style="background:rgba(147,197,253,.45);height:1px"></span>공동연구 (별을 누르면 표시 · 전체는 아래 체크)</div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <button class="open-side" id="open-side" hidden>검색 · 순위 · 필터</button>
  <div class="side" id="side">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="search" role="tab">검색</button>
      <button data-tab="rank" role="tab">순위</button>
      <button data-tab="filter" role="tab">필터<span class="badge" id="filter-badge" hidden></span></button>
      <button class="fold" id="fold" aria-label="접기">×</button>
    </div>
    <div class="pane" id="pane-search">
      <input id="q" type="search" placeholder="이름 · 대학 · 분야 · 연구 키워드 (예: T세포)" autocomplete="off" />
      <div class="seg" id="q-mode" role="radiogroup" aria-label="검색 범위">
        <button data-mode="all" class="on">전체</button><button data-mode="topic">연구 분야</button><button data-mode="technique">기술</button>
      </div>
      <ol class="list" id="search-list"></ol>
    </div>
    <div class="pane" id="pane-filter" hidden>
      <div class="filter-head"><span id="filter-count"></span><button class="reset" id="filter-reset">초기화</button></div>
      <div class="list filters-scroll">
        <div class="fgroup"><h4>분야</h4><div class="chips" id="f-category"></div></div>
        <div class="fgroup"><h4>산학연병</h4><div class="chips" id="f-sector"></div></div>
        <div class="fgroup"><h4>지역</h4><div class="chips" id="f-region"></div></div>
        <div class="fgroup"><h4>기술</h4><div class="chips" id="f-technique"></div></div>
        <div class="fgroup"><h4>직위</h4><div class="chips" id="f-position"></div></div>
        <div class="fgroup"><h4>연구실 (졸업생 기준)</h4>
          <div class="seg period" role="radiogroup" aria-label="기간"><button data-period="recent" class="on">최근 5년</button><button data-period="all">전체</button></div>
          <div class="chips" id="f-lab"></div></div>
        <div class="fgroup"><h4>기타</h4><div class="chips" id="f-extra"></div></div>
      </div>
    </div>
    <div class="pane" id="pane-rank" hidden>
      <div class="filters">
        <select id="rank-by" aria-label="순위 기준">
          <option value="score">종합 점수</option>
          <option value="collaborator_count">공동연구 교수 수</option>
          <option value="faculty_trainee_count">교수가 된 제자 수</option>
          <optgroup label="연구실 (졸업생 기준)">
            <option value="lab:phd_years">박사 졸업기간 짧은 순</option>
            <option value="lab:papers_per_student">학생당 논문 수</option>
            <option value="lab:first_author_per_student">학생당 1저자 논문 수</option>
            <option value="lab:fwci_median">논문 영향력 (FWCI)</option>
            <option value="lab:top10_share">상위 10% 논문 비율</option>
            <option value="lab:faculty">교수가 된 졸업생 수</option>
            <option value="lab:industry">기업 진출 졸업생 수</option>
            <option value="lab:alumni">졸업생 수</option>
          </optgroup>
        </select>
        <select id="rank-period" aria-label="기간" hidden><option value="recent">최근 5년</option><option value="all">전체</option></select>
        <select id="rank-uni" aria-label="대학"></select>
      </div>
      <ol class="list" id="rank-list"></ol>
    </div>
  </div>
  <div class="hint">드래그: 회전 · 두 손가락: 줌 · 별을 누르면 교수 카드와 공동연구 선 · 빈 곳: 닫기</div>
  <div id="graph"></div>
  <div class="setbar" id="setbar" hidden>
    <span id="set-buttons"></span>
    <label><input type="checkbox" id="set-overlap">교집합 보기</label>
  </div>
  <div class="viewbar" id="viewbar">
    <label><input type="checkbox" id="view-sectors">산학연병으로 보기</label>
    <label><input type="checkbox" id="view-collab">공동연구 선 보기</label>
  </div>
  <aside class="card" id="card" hidden aria-live="polite"></aside>
  <a class="community" href="./community.html">💬 커뮤니티</a>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.76.1/dist/3d-force-graph.min.js"></script>
  <script src="./network-data.js"></script>
  <script>
    // One color per broad field (src/classify.py, data/field_categories.csv).
    const CATEGORY_COLORS={
      "분자·세포생물":"#60a5fa","임상의학":"#f472b6","암·종양":"#fb7185","면역·감염":"#2dd4bf",
      "신경과학":"#a78bfa","약학·신약":"#fbbf24","유전체·생물정보":"#34d399","의공학·바이오소재":"#f97316",
      "생리·대사":"#facc15","보건·역학":"#94a3b8","농생명·식품·생태":"#84cc16","기타":"#e5e7eb"
    };
    const CATEGORY_ORDER=Object.keys(CATEGORY_COLORS);
    const REGION_ORDER=["서울","경기·인천","강원","대전·충청","대구·경북","부산·울산·경남","광주·전라","제주","기타"];
    const POSITION_ORDER=["교수","부교수","조교수","책임연구원","선임연구원","미상"];
    // 산학연병: academia / hospital / research institute / industry (src/sectors.py).
    // In the 산학연병 view each is a circle; a professor sits in the overlap of their sets.
    const SECTORS=["학","병","연","산"];
    const SECTOR_INFO={
      "학":{label:"학 · 대학",color:"#60a5fa",c:[-1,1]},
      "병":{label:"병 · 병원",color:"#f472b6",c:[1,1]},
      "연":{label:"연 · 연구소",color:"#34d399",c:[-1,-1]},
      "산":{label:"산 · 기업",color:"#fbbf24",c:[1,-1]}
    };
    const sectorsOf=n=>(n.sectors&&n.sectors.length)?n.sectors:["학"];
    // 연구실정보 tab of the master Excel file (data/about_bio_master.xlsx).
    function labLine(lab){
      if(!lab) return "";
      const parts=[];
      if(lab.phd_years) parts.push(`박사 졸업 평균 ${lab.phd_years}년`);
      if(lab.integrated_years) parts.push(`석박통합 ${lab.integrated_years}년`);
      if(lab.ms_years) parts.push(`석사 ${lab.ms_years}년`);
      if(lab.papers_per_student) parts.push(`학생당 논문 ${lab.papers_per_student}편`);
      if(lab.first_author_per_student) parts.push(`1저자 ${lab.first_author_per_student}편`);
      const size=[lab.phd_students&&`박사 ${lab.phd_students}`,lab.ms_students&&`석사 ${lab.ms_students}`,lab.postdocs&&`포닥 ${lab.postdocs}`].filter(Boolean);
      if(size.length) parts.push(`구성 ${size.join(" · ")}`);
      if(/^(예|yes|y|o|모집)/i.test(String(lab.recruiting||""))) parts.push(`<b style="color:#fbbf24">모집 중</b>`);
      return parts.length?`<br><span style="color:#fde68a">연구실: ${parts.map(p=>p.startsWith("<b")?p:esc(p)).join(" · ")}</span>`:"";
    }
    const fieldColor=n=>CATEGORY_COLORS[n.category]||CATEGORY_COLORS["기타"];
    // Stars, not billiard balls: the field colour mixed with white light.
    function soften(hex,t=.5){
      const v=parseInt(hex.slice(1),16),r=v>>16,g=(v>>8)&255,b=v&255,m=c=>Math.round(c+(255-c)*t);
      return `#${((1<<24)|(m(r)<<16)|(m(g)<<8)|m(b)).toString(16).slice(1)}`;
    }
    const starColor=n=>soften(fieldColor(n),.45);
    const NODE_COUNT=(window.KOREA_BIO_MAP.nodes||[]).length;
    const SEG=NODE_COUNT>800?8:NODE_COUNT>200?14:24;

    // Names and departments come from scraped university pages: never inject raw.
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    // Collaboration lines are a faint background web; PhD / postdoc lineage
    // lines are the story, drawn bright with arrows (PI -> trainee).
    const LINK_STYLE={
      collaboration:{color:"rgba(147,197,253,0.10)",focus:"rgba(191,219,254,0.85)",width:0,focusWidth:.45,particles:0},
      advisor_student:{color:"#fbbf24",width:1.9,particles:2,particleColor:"#fde68a"},
      postdoc_mentor:{color:"#c084fc",width:1.4,particles:1,particleColor:"#ede9fe"}
    };
    const isLineage=l=>l.type==="advisor_student"||l.type==="postdoc_mentor";
    const endId=v=>typeof v==="object"?v.id:v;
    let focus=null, selected=null;
    const touchesFocus=l=>focus&&(endId(l.source)===focus.id||endId(l.target)===focus.id);
    // Collaboration strength (weighted by team size, seniority and recency;
    // see collaboration_weight in pipeline.py): 0.5 is the drawing threshold.
    const strengthLevel=l=>Math.min((Number(l.strength)||0.5)/3,1);   // 0..1
    function linkColor(l){
      const st=LINK_STYLE[l.type]||LINK_STYLE.collaboration;
      if(isLineage(l)) return st.color;
      const k=strengthLevel(l);
      return touchesFocus(l)
        ? `rgba(191,219,254,${(0.45+0.5*k).toFixed(2)})`
        : `rgba(147,197,253,${(0.05+0.17*k).toFixed(2)})`;
    }
    function linkWidth(l){
      const st=LINK_STYLE[l.type]||LINK_STYLE.collaboration;
      if(isLineage(l)) return st.width;
      return touchesFocus(l)?0.25+0.8*strengthLevel(l):0;
    }
    function setFocus(node){
      if((node&&node.id)===(focus&&focus.id)) return;
      focus=node||null;
      Graph.linkColor(linkColor).linkWidth(linkWidth);  // re-evaluate accessors
    }

    // Only PI -> student / postdoc lines are drawn by default; the 9,000+
    // collaboration lines are opt-in ("공동연구 선 보기"), and a selected
    // professor's own collaborations are drawn as a light overlay.
    const ALL_LINKS=window.KOREA_BIO_MAP.links||[];
    const LINEAGE_LINKS=ALL_LINKS.filter(isLineage);
    const COLLAB_BY_NODE=new Map();
    ALL_LINKS.forEach(l=>{
      if(isLineage(l)) return;
      [endId(l.source),endId(l.target)].forEach(id=>{(COLLAB_BY_NODE.get(id)||COLLAB_BY_NODE.set(id,[]).get(id)).push(l);});
    });
    let showCollab=false;

    const STAR_TEX=(()=>{
      const c=document.createElement("canvas");c.width=c.height=64;
      const g=c.getContext("2d"),gr=g.createRadialGradient(32,32,0,32,32,32);
      gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.16,"rgba(255,255,255,.95)");
      gr.addColorStop(.34,"rgba(255,255,255,.38)");gr.addColorStop(.6,"rgba(255,255,255,.10)");gr.addColorStop(1,"rgba(255,255,255,0)");
      g.fillStyle=gr;g.fillRect(0,0,64,64);
      return new THREE.CanvasTexture(c);
    })();
    const starMats=new Map();
    const starMaterial=color=>starMats.get(color)||starMats.set(color,new THREE.SpriteMaterial(
      {map:STAR_TEX,color,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})).get(color);

    const el=document.getElementById("graph");
    const Graph=ForceGraph3D()(el)
      .width(window.innerWidth)
      .height(window.innerHeight)
      .backgroundColor("rgba(0,0,0,0)")
      .showNavInfo(false)
      .graphData({nodes:window.KOREA_BIO_MAP.nodes,links:LINEAGE_LINKS})
      // One glowing sprite per star (2,500+ stars: spheres were too heavy).
      .nodeThreeObject(node=>{
        const r=2.8+Math.sqrt(Number(node.score||0)+1)*1.6;
        const s=new THREE.Sprite(starMaterial(starColor(node)));
        s.scale.set(r*3.4,r*3.4,1);
        return s;
      })
      .nodeLabel(n=>`<div style="padding:6px 8px"><b>${esc(n.name)}</b>${n.name_en&&n.name_en!==n.name?` (${esc(n.name_en)})`:""}<br>${esc(n.university_ko||n.university)}${n.department?` · ${esc(n.department)}`:""}<br><span style="color:#9aa7c7">${esc(n.category||"")}${(n.keywords||[]).length?` · ${n.keywords.slice(0,3).map(esc).join(", ")}`:""}</span></div>`)
      .linkLabel(l=>isLineage(l)
        ?`<div style="padding:5px 7px">${l.type==="advisor_student"?"지도교수 → 제자":"포닥 멘토 → 포닥"}<br>${l.verified==="auto"?`자동 추정 · 근거 논문 ${l.paper_count}편`:"확인됨"}</div>`
        :`<div style="padding:5px 7px">공동연구 · 논문 ${l.paper_count}편${l.last_year?` · 최근 ${l.last_year}년`:""}<br>협업 강도 ${(Number(l.strength)||0).toFixed(2)}</div>`)
      .linkColor(linkColor)
      .linkWidth(linkWidth)
      .linkOpacity(1)
      .linkDirectionalArrowLength(l=>isLineage(l)?4.5:0)
      .linkDirectionalArrowRelPos(.92)
      .linkDirectionalArrowColor(l=>LINK_STYLE[l.type]?.color||"#fff")
      .linkDirectionalParticles(l=>LINK_STYLE[l.type]?.particles||0)
      .linkDirectionalParticleWidth(l=>isLineage(l)?2.2:0)
      .linkDirectionalParticleSpeed(.004)
      .linkDirectionalParticleColor(l=>LINK_STYLE[l.type]?.particleColor||"#fff")
      .onNodeHover(node=>{
        if(!selected){setFocus(node);}
        el.style.cursor=node?"pointer":"default";
      })
      .onBackgroundClick(()=>{selected=null;setFocus(null);markActive(null);closeCard();drawOverlay();})
      .onEngineTick(()=>{if(overlay) drawOverlay();})
      .onNodeClick(node=>flyTo(node));

    function flyTo(node){
      selected=node;setFocus(node);
      Graph.controls().autoRotate=false;
      // Far enough to see the professor's neighbours, not just the star.
      const d=110;
      const len=Math.hypot(node.x||1,node.y||1,node.z||1);
      const ratio=1+d/len;
      // In the galaxy, look down on the star from above the disc (not
      // through the bright core); the 산학연병 sets are seen face-on.
      const h=Math.hypot(node.x||0,node.z||0)||1;
      const cam=viewMode==="galaxy"
        ?{x:node.x+node.x/h*d*.7,y:node.y+d*1.3,z:node.z+node.z/h*d*.7}
        :{x:(node.x||0)*ratio,y:(node.y||0)*ratio,z:(node.z||0)*ratio};
      Graph.cameraPosition(
        cam,
        node,
        900
      );
      markActive(node.id);
      openCard(node);
      drawOverlay();
    }

    // ---------- selected professor's collaboration lines (overlay) ----------
    let overlay=null;
    function drawOverlay(){
      if(overlay){Graph.scene().remove(overlay);overlay.geometry.dispose();overlay.material.dispose();overlay=null;}
      if(showCollab||!selected) return;
      const pts=[];
      (COLLAB_BY_NODE.get(selected.id)||[]).forEach(l=>{
        const other=NODE_BY_ID.get(endId(l.source)===selected.id?endId(l.target):endId(l.source));
        if(other&&shownNode(other)) pts.push(selected.x,selected.y,selected.z,other.x,other.y,other.z);
      });
      if(!pts.length) return;
      const g=new THREE.BufferGeometry();
      g.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
      overlay=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:"#bfdbfe",transparent:true,opacity:.5,depthWrite:false}));
      Graph.scene().add(overlay);
    }
    document.getElementById("view-collab").addEventListener("change",e=>{
      showCollab=e.target.checked;
      Graph.graphData({nodes:window.KOREA_BIO_MAP.nodes,links:showCollab?ALL_LINKS:LINEAGE_LINKS});
      refreshVisibility();drawOverlay();
    });

    // ---------- professor card ----------
    const card=document.getElementById("card");
    const safeUrl=u=>/^https?:\/\//i.test(String(u||""))?String(u):"";
    function people(ids,cls){
      return ids.map(id=>NODE_BY_ID.get(id)).filter(Boolean)
        .map(p=>`<button class="${cls}" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join("");
    }
    function lineageOf(n){
      const out={advisors:[],students:[],mentors:[],postdocs:[]};
      LINEAGE_LINKS.forEach(l=>{
        const a=endId(l.source),b=endId(l.target);
        if(l.type==="advisor_student"){if(a===n.id)out.students.push(b);if(b===n.id)out.advisors.push(a);}
        else{if(a===n.id)out.postdocs.push(b);if(b===n.id)out.mentors.push(a);}
      });
      return out;
    }
    // Durations read from years only (no entry/graduation month) are estimates.
    const yrs=(L,d)=>L[d+"_years"]?`${L[d+"_years_est"]?"약 ":""}${L[d+"_years"]}년${L[d+"_years_est"]?" (연도 기준 추정)":""}`:"";
    function labRows(lab){
      const L=lab||{},rows=[
        ["박사 평균 졸업기간",yrs(L,"phd")],["석박통합 평균",yrs(L,"integrated")],
        ["석사 평균 졸업기간",yrs(L,"ms")],["학생당 평균 논문",L.papers_per_student&&`${L.papers_per_student}편`],
        ["학생당 1저자 논문",L.first_author_per_student&&`${L.first_author_per_student}편`],["박사 졸업생",L.phd_graduates&&`${L.phd_graduates}명`],
        ["현재 구성",[L.phd_students&&`박사 ${L.phd_students}`,L.ms_students&&`석사 ${L.ms_students}`,L.postdocs&&`포닥 ${L.postdocs}`].filter(Boolean).join(" · ")],
        // FWCI 1.0 = world average for the field and year.
        ["논문 영향력 (FWCI 중앙값)",L.fwci_median!=null&&L.fwci_median!==""&&`${L.fwci_median} (세계 평균 1.0)`],
        ["상위 10% 피인용 논문",L.top10_share!=null&&L.top10_share!==""&&`${Math.round(L.top10_share*100)}%`]
      ].filter(r=>r[1]);
      return rows;
    }
    // Where the lab's alumni went (from the lab's alumni page), as one bar.
    const CAREER_INFO=[["faculty","교수","#fbbf24"],["postdoc","포닥","#c084fc"],["industry","기업","#60a5fa"],
      ["hospital","병원","#f472b6"],["institute","연구소","#34d399"],["other","기타","#94a3b8"]];
    function careerBlock(lab){
      const L=lab||{},c=L.careers;
      const total=c?CAREER_INFO.reduce((s,[k])=>s+(c[k]||0),0):0;
      const head=[L.top_journals&&`주요 1저자 저널: ${esc(L.top_journals)}`,
        L.source&&`출처: ${esc(L.source)}${L.as_of?` · ${esc(L.as_of)}`:""}`,
        L.alumni_url&&safeUrl(L.alumni_url)&&`<a href="${esc(safeUrl(L.alumni_url))}" target="_blank" rel="noopener" style="color:#93c5fd">졸업생 페이지</a>`].filter(Boolean);
      if(!total) return head.length?`<div class="muted" style="margin-top:8px">${head.join("<br>")}</div>`:"";
      const parts=CAREER_INFO.filter(([k])=>c[k]);
      return `<h3>졸업생 진로 (${total}명)</h3>
        <div class="careers">${parts.map(([k,,col])=>`<i style="flex:${c[k]};background:${col}"></i>`).join("")}</div>
        <div class="career-legend">${parts.map(([k,label,col])=>`<span><b style="background:${col}"></b>${label} ${c[k]}</span>`).join("")}</div>
        ${head.length?`<div class="muted" style="margin-top:6px">${head.join("<br>")}</div>`:""}`;
    }
    // ---------- lab alumni: recent 5 years / all time ----------
    let labPeriod="recent";
    const LAB_AUTO_KEYS=["alumni","phd_graduates","ms_graduates","postdoc_alumni","phd_years","integrated_years","ms_years",
      "phd_years_est","integrated_years_est","ms_years_est","students_with_papers","papers_per_student","first_author_per_student","fwci_median","top10_share","careers","top_journals"];
    // The lab's figures for one period; values typed into the master sheet apply to both.
    function labView(lab,period=labPeriod){
      if(!lab) return {};
      if(period!=="recent") return lab;
      const manual=new Set(lab.manual||[]),v={...lab};
      LAB_AUTO_KEYS.forEach(k=>{if(!manual.has(k)) delete v[k];});
      Object.entries(lab.recent||{}).forEach(([k,x])=>{if(!manual.has(k)) v[k]=x;});
      return v;
    }
    const hasAlumni=lab=>!!(lab&&(lab.alumni||lab.alumni_url));
    function periodSeg(lab){
      if(!hasAlumni(lab)) return "";
      const n=p=>labView(lab,p).alumni||0;
      return `<div class="seg period" role="radiogroup" aria-label="기간">
        <button data-period="recent" class="${labPeriod==="recent"?"on":""}">최근 5년 · ${n("recent")}명</button>
        <button data-period="all" class="${labPeriod==="all"?"on":""}">전체 · ${n("all")}명</button></div>`;
    }
    function setLabPeriod(p){
      if(p===labPeriod) return;
      labPeriod=p;
      document.querySelectorAll("[data-period]").forEach(b=>b.classList.toggle("on",b.dataset.period===p));
      buildLabFilters();applyFilters();
      if(selected&&!card.hidden){const top=card.scrollTop;openCard(selected);card.scrollTop=top;}
    }
    function openCard(n){
      const view=labView(n.lab),lin=lineageOf(n),lab=labRows(view),recruiting=/^(예|yes|y|o|모집)/i.test(String((n.lab||{}).recruiting||""));
      const url=safeUrl(n.url);
      card.innerHTML=`<button class="close" aria-label="닫기">×</button>
        <h2>${esc(n.name)}${n.name_en&&n.name_en!==n.name?`<span class="en">${esc(n.name_en)}</span>`:""}${recruiting?`<span class="recruit">모집 중</span>`:""}</h2>
        <div class="org">${esc(n.university_ko||n._uni||n.university)}${n.department?` · ${esc(n.department)}`:""}${n.position?` · ${esc(n.position)}`:""}</div>
        <div class="tags">${sectorsOf(n).map(x=>`<span class="tag" style="border-color:${SECTOR_INFO[x].color}55;color:${SECTOR_INFO[x].color}">${esc(SECTOR_INFO[x].label)}</span>`).join("")}
          ${n.category?`<span class="tag" style="color:${soften(fieldColor(n),.3)}">${esc(n.category)}</span>`:""}${n.region?`<span class="tag">${esc(n.region)}</span>`:""}</div>
        <div class="stats" style="margin-top:12px">
          <div class="stat"><b>${n.score}</b><span>점수</span></div>
          <div class="stat"><b>${n.collaborator_count}</b><span>공동연구</span></div>
          <div class="stat"><b>${lin.students.length}</b><span>교수 된 제자</span></div>
          <div class="stat"><b>${lin.postdocs.length}</b><span>PI 된 포닥</span></div>
        </div>
        <h3>연구실 정보</h3>
        ${periodSeg(n.lab)}
        ${lab.length?`<div class="lab">${lab.map(r=>`<span>${esc(r[0])}</span><span>${esc(r[1])}</span>`).join("")}</div>`
          :`<div class="muted">${hasAlumni(n.lab)&&labPeriod==="recent"?"최근 5년 졸업생 정보가 없어요. 전체를 눌러 보세요.":"아직 졸업기간·학생당 논문 수 같은 연구실 정보가 없어요. 이 연구실을 아신다면 커뮤니티에서 알려주세요."}</div>`}
        ${careerBlock(view)}
        ${(n.keywords||[]).length?`<h3>연구 분야</h3><div class="tags">${n.keywords.slice(0,8).map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div>`:""}
        ${(n.techniques||[]).length?`<h3>주요 기술</h3><div class="tags">${n.techniques.slice(0,6).map(k=>`<span class="tag tech">${esc(k)}</span>`).join("")}</div>`:""}
        ${lin.advisors.length||lin.mentors.length?`<h3>지도교수 · 포닥 멘토</h3><div class="people">${people(lin.advisors,"")}${people(lin.mentors,"pd")}</div>`:""}
        ${lin.students.length||lin.postdocs.length?`<h3>교수가 된 제자 · 포닥</h3><div class="people">${people(lin.students,"")}${people(lin.postdocs,"pd")}</div>`:""}
        <div class="links">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">연구실·소속 페이지</a>`:""}
          ${n.openalex_id?`<a href="https://openalex.org/${esc(n.openalex_id)}" target="_blank" rel="noopener">논문 (OpenAlex)</a>`:""}
          ${n.orcid?`<a href="https://orcid.org/${esc(n.orcid)}" target="_blank" rel="noopener">ORCID</a>`:""}</div>`;
      card.hidden=false;document.body.classList.add("card-open");
      card.scrollTop=0;
      card.querySelectorAll(".period [data-period]").forEach(b=>b.addEventListener("click",()=>setLabPeriod(b.dataset.period)));
      card.querySelector(".close").addEventListener("click",()=>{selected=null;setFocus(null);markActive(null);closeCard();drawOverlay();});
      card.querySelectorAll(".people button").forEach(b=>b.addEventListener("click",()=>{const p=NODE_BY_ID.get(b.dataset.id);if(p) flyTo(p);}));
    }
    function closeCard(){card.hidden=true;document.body.classList.remove("card-open");}

    Graph.d3Force("charge").strength(-14).distanceMax(90);   // the galaxy force does the spreading
    // Lineage pulls PI and trainees close; collaboration only loosely.
    Graph.d3Force("link")
      .distance(l=>isLineage(l)?14:70)
      .strength(l=>isLineage(l)?.6:.01);
    // ---------- spiral galaxy ----------
    // The force layout is folded into a flat disc (x-z plane) with four spiral
    // arms; related fields share an arm, so each arm has its own tint.
    const ARM_OF={
      "분자·세포생물":0,"유전체·생물정보":0,"생리·대사":0,
      "임상의학":1,"암·종양":1,"보건·역학":1,
      "신경과학":2,"면역·감염":2,"약학·신약":2,
      "의공학·바이오소재":3,"농생명·식품·생태":3,"기타":3
    };
    const ARM_SHIFT={};   // fields on one arm sit side by side
    Object.entries(ARM_OF).forEach(([cat,arm])=>{
      const same=Object.keys(ARM_OF).filter(c=>ARM_OF[c]===arm);
      ARM_SHIFT[cat]=arm*Math.PI/2+(same.indexOf(cat)-(same.length-1)/2)*0.22;
    });
    const TWIST=1.15, R0=60, R_GAL=1150;
    // Whole galaxy in view; a portrait phone needs to stand further back.
    const galaxyView=()=>{const k=innerWidth<innerHeight?1.9:1;return {x:0,y:R_GAL*1.05*k,z:R_GAL*1.75*k};};
    const armAngle=(base,r)=>base+TWIST*Math.log(Math.max(r,R0)/R0);
    // Every star gets a fixed home on its field's arm (seeded by its id, so the
    // galaxy looks the same on every visit). Trainees live next to their PI.
    const seeded=id=>{let h=2166136261;for(const ch of String(id)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
      return ()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};};
    const gauss=rnd=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(2*Math.PI*rnd());
    const HOME=new Map();
    (window.KOREA_BIO_MAP.nodes||[]).forEach(n=>{
      const rnd=seeded(n.id),u=rnd();
      let x,y,z;
      if(u<.05){                                             // central bulge
        const r=R0*1.6*Math.sqrt(rnd()),a=rnd()*Math.PI*2;
        x=r*Math.cos(a);z=r*Math.sin(a);y=gauss(rnd)*R0*.35;
      }else{
        const r=R0+(R_GAL-R0)*Math.pow((u-.05)/.95,.7);
        const a=armAngle(ARM_SHIFT[n.category]??ARM_SHIFT["기타"],r)+gauss(rnd)*(.07+2.6/Math.sqrt(r));
        x=r*Math.cos(a);z=r*Math.sin(a);y=gauss(rnd)*(4+r*.012);
      }
      HOME.set(n.id,{x,y,z});
    });
    const idOf=v=>typeof v==="object"?v.id:v;
    for(let pass=0;pass<3;pass++) (window.KOREA_BIO_MAP.links||[]).filter(isLineage).forEach(l=>{
      const pi=HOME.get(idOf(l.source)),st=HOME.get(idOf(l.target));
      if(!pi||!st) return;
      const rnd=seeded(idOf(l.target)+"t");
      st.x=pi.x+gauss(rnd)*9;st.y=pi.y+gauss(rnd)*4;st.z=pi.z+gauss(rnd)*9;
    });
    function galaxyForce(){
      let nodes=[];
      function force(alpha){
        if(viewMode!=="galaxy") return;
        for(const n of nodes){
          if(n.fx!==undefined&&n.fx!==null) continue;
          const h=HOME.get(n.id); if(!h) continue;
          n.vx+=(h.x-n.x)*.5*alpha;n.vy+=(h.y-n.y)*.5*alpha;n.vz+=(h.z-n.z)*.5*alpha;
        }
      }
      force.initialize=ns=>{nodes=ns;ns.forEach(n=>{const h=HOME.get(n.id);if(h&&n.x===undefined){n.x=h.x;n.y=h.y;n.z=h.z;}});};
      return force;
    }
    Graph.d3Force("galaxy",galaxyForce());
    // Seen from above at an angle; the galaxy turns slowly about its axis.
    Graph.cameraPosition(galaxyView(),{x:0,y:0,z:0});

    const controls=Graph.controls();
    controls.autoRotate=true;
    controls.autoRotateSpeed=.25;
    controls.enableDamping=true;
    controls.dampingFactor=.08;

    // Soft round sprites for nebulae and the galactic core.
    const softTex=(stops)=>{
      const c=document.createElement("canvas");c.width=c.height=128;
      const g=c.getContext("2d"),gr=g.createRadialGradient(64,64,0,64,64,64);
      stops.forEach(([o,a])=>gr.addColorStop(o,`rgba(255,255,255,${a})`));
      g.fillStyle=gr;g.fillRect(0,0,128,128);
      return new THREE.CanvasTexture(c);
    };
    const NEBULA_TEX=softTex([[0,.55],[.35,.22],[.7,.06],[1,0]]);
    const glowSprite=(tex,color,scale,opacity)=>{
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending}));
      sp.scale.set(scale,scale,1);
      return sp;
    };

    // Background: three layers of stars in slightly different colours that
    // twinkle out of phase, and a few distant nebulae.
    const twinkle=[];
    [[1400,3.0,.75,["#ffffff","#dbeafe","#fde68a"]],[900,4.5,.55,["#c7d2fe","#fbcfe8","#ffffff"]],[260,7,.9,["#ffffff","#bae6fd"]]]
      .forEach(([count,size,opacity,palette],layer)=>{
        const pos=[],col=[],c=new THREE.Color();
        for(let i=0;i<count;i++){
          const radius=3200+Math.random()*1800,theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);
          pos.push(radius*Math.sin(phi)*Math.cos(theta),radius*Math.cos(phi),radius*Math.sin(phi)*Math.sin(theta));
          c.set(palette[i%palette.length]);col.push(c.r,c.g,c.b);
        }
        const g=new THREE.BufferGeometry();
        g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
        g.setAttribute("color",new THREE.Float32BufferAttribute(col,3));

    function queryTerms(raw){
      const base=norm(raw);

      });
      hits.sort((a,b)=>(norm(b.n.name)===term)-(norm(a.n.name)===term)

    // ---------- 산학연병 view ----------
    // Default: one galaxy disc per set (학 · 병 · 연 · 산), each professor in their
    // home set (the page they are listed on). "교집합 보기" turns the discs into
    // an overlapping Venn diagram and moves people with several affiliations into
    // the overlaps. Clicking a set zooms into it and hides everyone else.
    const homeOf=n=>SECTOR_INFO[n.home_sector]?n.home_sector:sectorsOf(n)[0];
    const setCount=(s,overlap)=>NODES.filter(n=>overlap?sectorsOf(n).includes(s):homeOf(n)===s).length;
    const VENN_R=165, VENN_D=85;    // diagonal pairs (학∩산, 병∩연) still overlap near the centre
    let viewMode="galaxy", overlapOn=false, zoomSet=null, setGroup=null, circles={};

    function layoutCircles(){
      circles={};
      if(overlapOn){
        SECTORS.forEach(s=>{const [a,b]=SECTOR_INFO[s].c;circles[s]={x:a*VENN_D,y:b*VENN_D,r:VENN_R};});
        return;
      }
      // Separate discs sized by how many people they hold: one row on wide
      // screens, 2 x 2 on portrait phones.
      const radius=s=>Math.max(55,Math.min(300,40+10*Math.sqrt(setCount(s,false))));
      const gap=40;
      const rows=window.innerWidth<window.innerHeight?[SECTORS.slice(0,2),SECTORS.slice(2)]:[SECTORS];
      const rowH=rows.map(r=>2*Math.max(...r.map(radius)));
      let y=(rowH.reduce((a,b)=>a+b,0)+gap*(rows.length-1))/2;
      rows.forEach((row,i)=>{
        const total=row.reduce((t,s)=>t+2*radius(s),0)+gap*(row.length-1);
        let x=-total/2;
        const cy=y-rowH[i]/2;
        row.forEach(s=>{const r=radius(s);circles[s]={x:x+r,y:cy,r};x+=2*r+gap;});
        y-=rowH[i]+gap;
      });
    }
    const distTo=(x,y,s)=>Math.hypot(x-circles[s].x,y-circles[s].y);
    function placeNode(n){
      if(!overlapOn){
        // Galaxy disc: denser towards the centre.
        const c=circles[homeOf(n)], a=Math.random()*Math.PI*2, r=c.r*0.92*Math.pow(Math.random(),0.75);
        n.fx=c.x+r*Math.cos(a);n.fy=c.y+r*Math.sin(a);n.fz=(Math.random()*2-1)*c.r*0.15;
        return;
      }
      // Random point whose circles are exactly the person's sets (clear of other
      // circles' edges); if no such region exists, the closest one.
      const want=new Set(sectorsOf(n));
      let best=[0,0],bestBad=Infinity;
      const span=VENN_D+VENN_R;
      for(let i=0;i<600&&bestBad>0;i++){
        const x=(Math.random()*2-1)*span, y=(Math.random()*2-1)*span;
        const inside=SECTORS.filter(s=>distTo(x,y,s)<VENN_R*0.9);
        if(!inside.length) continue;
        const near=SECTORS.filter(s=>distTo(x,y,s)<VENN_R*1.06);
        const bad=10*[...want].filter(s=>!inside.includes(s)).length+near.filter(s=>!want.has(s)).length;
        if(bad<bestBad){bestBad=bad;best=[x,y];}
      }
      n.fx=best[0];n.fy=best[1];n.fz=(Math.random()*2-1)*16;
    }
    function textSprite(text,color){

      g.fillText(text,256,48);
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
      sp.scale.set(150,28,1);
      return sp;
    }
    function clearSetGroup(){

    function drawCircles(){
      clearSetGroup();
      setGroup=new THREE.Group();
      SECTORS.forEach(s=>{
        const {color,label,c}=SECTOR_INFO[s], {x,y,r}=circles[s];
        const dim=zoomSet&&zoomSet!==s;
        const disc=new THREE.Mesh(new THREE.CircleGeometry(r,96),
          new THREE.MeshBasicMaterial({color,transparent:true,opacity:dim?.015:.05,side:THREE.DoubleSide,depthWrite:false}));
        disc.position.set(x,y,-20);setGroup.add(disc);

          new THREE.MeshBasicMaterial({color,transparent:true,opacity:dim?.15:.6,side:THREE.DoubleSide,depthWrite:false}));
        ring.position.set(x,y,-20);setGroup.add(ring);
        const tag=textSprite(`${label}  ${setCount(s,overlapOn)}명`,color);
        if(overlapOn) tag.position.set(c[0]*(VENN_D+VENN_R*0.62),c[1]*(VENN_D+VENN_R*0.9),0);
        else tag.position.set(x,y+r+24,0);
        setGroup.add(tag);
      });
      Graph.scene().add(setGroup);

    function buildSetButtons(){
      const box=document.getElementById("set-buttons");
      const mk=(key,label,count,color)=>{
        const b=document.createElement("button");
        b.className=(zoomSet===key||(!zoomSet&&key==="all"))?"on":"";
        b.innerHTML=`${color?`<span class="dot" style="background:${color};color:${color}"></span>`:""}${esc(label)}${count!==undefined?` <small>${count}</small>`:""}`;
        b.addEventListener("click",()=>zoomTo(key==="all"?null:key));
        return b;
      };
      box.replaceChildren(mk("all","전체"),...SECTORS.map(s=>mk(s,SECTOR_INFO[s].label,setCount(s,overlapOn),SECTOR_INFO[s].color)));
    }
    // Camera distance at which a w x h box fills the screen (both orientations).
    function fitZ(w,h){
      const fov=(Graph.camera().fov||40)*Math.PI/180, aspect=window.innerWidth/window.innerHeight;
      return 1.12*Math.max(h,w/aspect)/(2*Math.tan(fov/2));
    }
    function cameraOverview(){
      const xs=SECTORS.map(s=>[circles[s].x-circles[s].r,circles[s].x+circles[s].r]).flat();
      const ys=SECTORS.map(s=>[circles[s].y-circles[s].r,circles[s].y+circles[s].r+40]).flat();
      const cx=(Math.max(...xs)+Math.min(...xs))/2, cy=(Math.max(...ys)+Math.min(...ys))/2;
      const z=fitZ(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
      Graph.cameraPosition({x:cx,y:cy,z},{x:cx,y:cy,z:0},900);
    }
    function zoomTo(set){
      zoomSet=set;
      NODES.forEach(n=>{n._inSet=!set||(overlapOn?sectorsOf(n).includes(set):homeOf(n)===set);});
      refreshVisibility();drawCircles();buildSetButtons();
      if(!set) return cameraOverview();
      const c=circles[set];
      Graph.cameraPosition({x:c.x,y:c.y-c.r*0.3,z:fitZ(2*c.r,2*c.r+60)},{x:c.x,y:c.y,z:0},1000);
    }
    function relayout(){
      layoutCircles();NODES.forEach(placeNode);
      Graph.d3ReheatSimulation();
      zoomTo(zoomSet);
    }
    function setView(view){
      viewMode=view;
      document.getElementById("view-sectors").checked=view==="sectors";
      document.getElementById("setbar").hidden=view!=="sectors";
      if(view==="sectors"){
        if(galaxyDecor) Graph.scene().remove(galaxyDecor);
        controls.autoRotate=false;
        if(window.matchMedia("(max-width:640px)").matches) setSide(false);  // room for the set bar
        relayout();
      }else{
        zoomSet=null;
        NODES.forEach(n=>{delete n.fx;delete n.fy;delete n.fz;n._inSet=true;});
        clearSetGroup();refreshVisibility();
        controls.autoRotate=true;
        if(galaxyDecor) Graph.scene().add(galaxyDecor);
        Graph.cameraPosition(galaxyView(),{x:0,y:0,z:0},900);
        Graph.d3ReheatSimulation();
      }
    }
    document.getElementById("set-overlap").addEventListener("change",e=>{overlapOn=e.target.checked;relayout();});
    // The map opens as the usual galaxy; the 산학연병 layout is opt-in.
    document.getElementById("view-sectors").addEventListener("change",e=>setView(e.target.checked?"sectors":"galaxy"));

    buildFilters();applyFilters();
    if(window.matchMedia("(max-width:640px)").matches) setSide(false);
  </script>
</body>
</html>
