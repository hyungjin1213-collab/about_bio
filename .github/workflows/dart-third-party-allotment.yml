name: DART Third-Party Allotment

on:
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠 치를 조회할까요?"
        required: true
        default: "365"
  push:
    paths:
      - "1. dart third party allotment/src/**"
      - ".github/workflows/dart-third-party-allotment.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    defaults:
      run:
        working-directory: "1. dart third party allotment"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Collect from DART
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 DART_API_KEY 를 추가하세요."
            exit 1
          fi
          python src/collect.py --days "${{ inputs.days || '365' }}"

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: dart-third-party-allotment
          path: "1. dart third party allotment/output/*.csv"
          if-no-files-found: error

      - name: Commit results back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/*.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update DART third-party allotment data"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
